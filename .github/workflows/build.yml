name: Fabric 1.21.11 build
on:
  push:
    branches: [main, arena/152ebf42-cpvp-macros-pro]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build remapped Fabric jar
        run: ./gradlew --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: cpvp-macros-pro-1.21.11
          path: build/libs/*.jar
          if-no-files-found: error
